# Argo CD keeps the dishpatch namespace of the local kind cluster in line with
# charts/dishpatch on the main branch, using values-kind.yaml.
#   automated.prune:    objects removed from Git are removed from the cluster
#   automated.selfHeal: manual changes in the cluster are reverted
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dishpatch
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dishpatch
  source:
    repoURL: https://github.com/paighanutkarsh2410-lab/dishpatch-infra.git
    targetRevision: main
    path: charts/dishpatch
    helm:
      releaseName: dishpatch
      valueFiles:
        - values-kind.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dishpatch
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
