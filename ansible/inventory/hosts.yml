# The server address comes from Terraform:
#   export DISHPATCH_SERVER_IP="$(terraform -chdir=../terraform/aws output -raw server_public_ip)"
all:
  children:
    k3s_servers:
      hosts:
        dishpatch-aws:
          ansible_host: "{{ lookup('ansible.builtin.env', 'DISHPATCH_SERVER_IP') }}"
          ansible_user: ec2-user
